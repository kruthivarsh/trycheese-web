<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
// Procedural PLACEHOLDER frames for the trycheese site (not photographs).
// Each frame: tonal scene + light sources with bloom and red halation +
// luminance-weighted film grain + vignette. Replace with real trycheese
// shots before launch. Generated by scripts/generate-placeholder-frames.mjs.
const W = 1600, H = 1067;

function rng(seed) { // mulberry32: deterministic output per frame
  return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

const scenes = [
  { sky: ["#f2c27a", "#e39a4c", "#a6522a"], horizon: 0.64, ground: ["#5a2e1c", "#2a1610"], lights: [{ x: 0.72, y: 0.4, r: 70, k: 1 }], grain: 0.06 },
  { sky: ["#0d1418", "#16222a", "#1f2a2f"], horizon: 0.7, ground: ["#141414", "#0b0b0b"], lights: [{ x: 0.28, y: 0.42, r: 16, k: 1 }, { x: 0.62, y: 0.36, r: 13, k: 0.9 }, { x: 0.83, y: 0.5, r: 10, k: 0.75 }, { x: 0.45, y: 0.55, r: 8, k: 0.6 }], grain: 0.09 },
  { sky: ["#3f86c4", "#7fb6dc", "#cfe3ee"], horizon: 0.55, ground: ["#e7d3a6", "#b88a4f"], lights: [], grain: 0.05, sat: 1.15 },
  { sky: ["#2a2a2a", "#1c1c1c", "#121212"], horizon: 1.1, ground: ["#111", "#0a0a0a"], window: { x: 0.24, y: 0.18, w: 0.26, h: 0.5 }, lights: [], grain: 0.1, bw: true },
  { sky: ["#f1dcc1", "#e2b896", "#a9786a"], horizon: 0.78, ground: ["#8a6458", "#5c4440"], lights: [{ x: 0.5, y: 0.42, r: 40, k: 0.55 }], grain: 0.05, fade: 0.18 },
  { sky: ["#9fb98b", "#557a4a", "#2c4a34"], horizon: 0.6, ground: ["#3a4a26", "#1f2715"], lights: [{ x: 0.68, y: 0.3, r: 55, k: 0.9 }], grain: 0.07 },
  { sky: ["#140c0a", "#1f110d", "#120a08"], horizon: 0.8, ground: ["#0d0806", "#070504"], lights: [{ x: 0.52, y: 0.46, r: 22, k: 1.15 }], grain: 0.1 },
  { sky: ["#f0a07a", "#d2536a", "#5a3577"], horizon: 0.68, ground: ["#2c1a33", "#140c18"], lights: [{ x: 0.3, y: 0.56, r: 9, k: 0.8 }, { x: 0.55, y: 0.6, r: 7, k: 0.7 }, { x: 0.76, y: 0.58, r: 8, k: 0.8 }], grain: 0.07, sat: 1.1 },
  { sky: ["#d6d1c8", "#a29d95", "#7d7871"], horizon: 0.42, ground: ["#3c3935", "#1f1d1b"], lights: [], grain: 0.09, bw: true },
  { sky: ["#bfd9d3", "#a9bfae", "#d9c39b"], horizon: 0.66, ground: ["#c9ad86", "#8d7258"], lights: [{ x: 0.62, y: 0.32, r: 45, k: 0.5 }], grain: 0.05, fade: 0.2 },
  { sky: ["#2b1f2e", "#3d2731", "#1a1316"], horizon: 0.86, ground: ["#150f12", "#0a0709"], lights: [{ x: 0.24, y: 0.64, r: 20, k: 0.95 }, { x: 0.77, y: 0.58, r: 18, k: 0.9 }], grain: 0.09 },
  { sky: ["#3d2a4a", "#8a3f3a", "#e0864a"], horizon: 0.72, ground: ["#241520", "#110a10"], lights: [{ x: 0.46, y: 0.7, r: 60, k: 1 }], grain: 0.07 },
];

function render(i) {
  const s = scenes[i], rand = rng(1000 + i);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  // sky
  const g = x.createLinearGradient(0, 0, 0, H * Math.min(s.horizon, 1));
  s.sky.forEach((col, j) => g.addColorStop(j / (s.sky.length - 1), col));
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // ground
  if (s.horizon < 1) {
    const gy = H * s.horizon, gg = x.createLinearGradient(0, gy, 0, H);
    gg.addColorStop(0, s.ground[0]); gg.addColorStop(1, s.ground[1]);
    x.fillStyle = gg; x.fillRect(0, gy, W, H - gy);
  }
  // window light (B&W interior)
  const lightLayer = document.createElement("canvas"); lightLayer.width = W; lightLayer.height = H;
  const l = lightLayer.getContext("2d");
  if (s.window) {
    const { x: wx, y: wy, w, h } = s.window;
    x.fillStyle = "#e9e6df"; x.fillRect(wx * W, wy * H, w * W, h * H);
    x.fillStyle = "#1a1a1a"; x.fillRect((wx + w / 2) * W - 6, wy * H, 12, h * H); x.fillRect(wx * W, (wy + h / 2) * H - 6, w * W, 12);
    l.fillStyle = "#fff"; l.fillRect(wx * W, wy * H, w * W, h * H);
    // light spill on the floor
    const sp = x.createRadialGradient((wx + w / 2) * W, H * 0.95, 10, (wx + w / 2) * W, H * 0.95, W * 0.4);
    sp.addColorStop(0, "rgba(220,215,205,0.35)"); sp.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = sp; x.fillRect(0, 0, W, H);
  }
  // light sources: hot core on the image + a mask for bloom/halation
  for (const p of s.lights) {
    const cx = p.x * W, cy = p.y * H;
    const core = x.createRadialGradient(cx, cy, 0, cx, cy, p.r * 2.2);
    core.addColorStop(0, `rgba(255,250,235,${Math.min(1, p.k)})`);
    core.addColorStop(0.35, `rgba(255,214,150,${0.85 * p.k})`);
    core.addColorStop(1, "rgba(255,180,100,0)");
    x.fillStyle = core; x.beginPath(); x.arc(cx, cy, p.r * 2.2, 0, Math.PI * 2); x.fill();
    l.fillStyle = `rgba(255,255,255,${Math.min(1, p.k)})`; l.beginPath(); l.arc(cx, cy, p.r, 0, Math.PI * 2); l.fill();
  }
  // bloom (warm white, tight) and halation (red-orange, wide) from the highlight mask only
  const blur = (src, px) => { const b = document.createElement("canvas"); b.width = W; b.height = H; const bx = b.getContext("2d"); bx.filter = `blur(${px}px)`; bx.drawImage(src, 0, 0); return b; };
  const tint = (src, col, a) => { const t = document.createElement("canvas"); t.width = W; t.height = H; const tx = t.getContext("2d"); tx.drawImage(src, 0, 0); tx.globalCompositeOperation = "source-in"; tx.fillStyle = col; tx.globalAlpha = a; tx.fillRect(0, 0, W, H); return t; };
  // halation mask: the same highlights, dilated, so the red ring sits just outside the bloom
  const halo = document.createElement("canvas"); halo.width = W; halo.height = H;
  const hx = halo.getContext("2d");
  for (const p of s.lights) { hx.fillStyle = `rgba(255,255,255,${Math.min(1, p.k)})`; hx.beginPath(); hx.arc(p.x * W, p.y * H, p.r * 1.9, 0, Math.PI * 2); hx.fill(); }
  if (s.window) { const { x: wx, y: wy, w, h } = s.window; hx.fillStyle = "#fff"; hx.fillRect(wx * W - 8, wy * H - 8, w * W + 16, h * H + 16); }
  x.globalCompositeOperation = "screen";
  x.drawImage(tint(blur(lightLayer, 12), s.bw ? "#ffffff" : "#ffe9c8", 1), 0, 0);
  x.globalCompositeOperation = "lighter";
  x.drawImage(tint(blur(halo, 26), s.bw ? "#9a9a9a" : "#ff3a14", 0.8), 0, 0);
  x.globalCompositeOperation = "screen";
  x.drawImage(tint(blur(halo, 80), s.bw ? "#5e5e5e" : "#b8301b", 0.75), 0, 0);
  x.globalCompositeOperation = "source-over";
  // vignette
  const v = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.42)");
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  // per-pixel: fade, saturation, B&W, luminance-weighted grain
  const d = x.getImageData(0, 0, W, H), a = d.data;
  const fade = s.fade ?? 0, sat = s.sat ?? 1, amp = 255 * s.grain;
  for (let k = 0; k < a.length; k += 4) {
    let r = a[k], gg = a[k + 1], b = a[k + 2];
    const lum = 0.2126 * r + 0.7152 * gg + 0.0722 * b;
    if (s.bw) { r = gg = b = lum; }
    else if (sat !== 1) { r = lum + (r - lum) * sat; gg = lum + (gg - lum) * sat; b = lum + (b - lum) * sat; }
    if (fade) { r = r * (1 - fade) + 40 * fade + fade * 0.25 * r; gg = gg * (1 - fade) + 34 * fade + fade * 0.25 * gg; b = b * (1 - fade) + 30 * fade + fade * 0.25 * b; }
    const t = lum / 255, weight = 0.35 + 1.6 * t * (1 - t); // strongest in the midtones
    const n = ((rand() + rand() + rand()) / 3 - 0.5) * 2 * amp * weight;
    const cn = s.bw ? 0 : 0.25;
    a[k] = r + n + n * cn * (rand() - 0.5); a[k + 1] = gg + n; a[k + 2] = b + n + n * cn * (rand() - 0.5);
  }
  x.putImageData(d, 0, 0);
  return c.toDataURL("image/jpeg", 0.93).split(",")[1];
}
window.renderFrame = render;
window.frameCount = scenes.length;
</script>
</body></html>
